server:
  port: 8080

spring:
  application:
    name: ft8-monitor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:ft8-monitor}
      # 'latest' = live only; set to 'earliest' to backfill the window on startup.
      auto-offset-reset: ${KAFKA_OFFSET_RESET:latest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Used only by the dev publish helper (see the 'dev' profile).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# FT8 monitor settings
ft8:
  topic: ${FT8_TOPIC:ft8.decodes}
  window-seconds: ${FT8_WINDOW_SECONDS:3600}     # rolling in-memory retention (~1h)
  gap-seconds: ${FT8_GAP_SECONDS:180}            # QSO split threshold
  eviction-interval-ms: ${FT8_EVICTION_MS:60000} # background eviction sweep

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    de.bockermann.ft8monitor: INFO
