server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Mount the whole app (SPA + API) under a path, e.g. /ft8. Empty = root.
    # NOTE: serving the UI under a non-root path also needs the frontend base
    # path wired up (planned with the multi-view frontend work).
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}

spring:
  application:
    name: ft8-monitor
  # Embedded SQLite for aggregated statistics (one file; reusable later).
  datasource:
    url: jdbc:sqlite:${FT8_STATS_FILE:ft8web-stats.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1          # SQLite is single-writer; serialize access
      connection-test-query: SELECT 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.50.59:9092}
    consumer:
      # Default group is per-host (ft8.hostname injected at startup), so monitors
      # on different machines get distinct groups and don't compete for the
      # topic's partitions. Override with KAFKA_GROUP.
      group-id: ${KAFKA_GROUP:ft8-monitor-${ft8.hostname}}
      # 'latest' = live only; set to 'earliest' to backfill the window on startup.
      auto-offset-reset: ${KAFKA_OFFSET_RESET:latest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Used by the bundled UDP→Kafka bridge and the dev publish helper.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# FT8 monitor settings
ft8:
  topic: ${FT8_TOPIC:ft8}
  window-seconds: ${FT8_WINDOW_SECONDS:3600}     # rolling in-memory retention (~1h)
  gap-seconds: ${FT8_GAP_SECONDS:180}            # QSO split threshold
  eviction-interval-ms: ${FT8_EVICTION_MS:60000} # background eviction sweep
  # On startup, replay the last N minutes so the in-memory views are repopulated
  # after a restart (0 = off). Display consumer only; not the PSKReporter feeder.
  backfill-minutes: ${FT8_BACKFILL_MINUTES:15}
  # How long to keep PSKReporter report statistics in SQLite (days).
  stats-retention-days: ${FT8_STATS_RETENTION_DAYS:365}

  # Web-editable station settings (callsign, locator) are persisted here.
  config-file: ${FT8_CONFIG_FILE:ft8web.properties}

  # Bundled UDP→Kafka bridge: replaces ft8mon's scripts/udp_kafka_bridge.py.
  # Off by default; enable it on the host that receives ft8mon's -json output
  # (ft8mon ... -json <this-host>:5001). Data still flows UDP → Kafka → consumer.
  bridge:
    enabled: ${FT8_BRIDGE_ENABLED:false}
    bind: ${FT8_BRIDGE_BIND:0.0.0.0}   # interface to listen on
    port: ${FT8_BRIDGE_PORT:5001}      # UDP port (ft8mon -json target)
    key-field: ${FT8_BRIDGE_KEY:band}  # JSON field → Kafka key; blank for none
    validate: ${FT8_BRIDGE_VALIDATE:false}

# PSKReporter feeder. The user-facing settings (enabled, antenna, host, port,
# interval) live in the web-editable settings file alongside callsign/locator;
# these are only the non-user-facing knobs.
pskreporter:
  kafka-group: ${PSKREPORTER_KAFKA_GROUP:pskreporter-${ft8.hostname}} # own consumer group
  software: ${PSKREPORTER_SOFTWARE:ft8web 0.2.0}                      # reported decoder name
  tick-ms: ${PSKREPORTER_TICK_MS:15000}                               # heartbeat/flush check

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    de.bockermann.ft8monitor: INFO
